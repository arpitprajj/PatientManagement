 name: CI/CD → Docker Hub + Minikube

 on:
   push:
     branches: [master, main]

 jobs:
   build-and-deploy:
     runs-on: self-hosted   # ← runs on YOUR machine with Minikube
     env:
       FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

     steps:
       # ── 1. Checkout ──
       - name: Checkout code
         uses: actions/checkout@v4

       # ── 2. Set up JDK ──
       - name: Set up JDK 17
         uses: actions/setup-java@v4
         with:
           java-version: '17'
           distribution: 'temurin'
           cache: maven

       # ── 3. Login to Docker Hub ──
       - name: Login to Docker Hub
         uses: docker/login-action@v3
         with:
           username: ${{ secrets.DOCKERHUB_USERNAME }}
           password: ${{ secrets.DOCKERHUB_TOKEN }}

       # ── 4. Build + Push: patient-service ──
       - name: Build & Push patient-service
         uses: docker/build-push-action@v5
         with:
           context: ./patient-service
           push: true
           tags: |
             arpitprajj/patient-service:latest
             arpitprajj/patient-service:${{ github.sha }}

       # ── 5. Build + Push: billing-service ──
       - name: Build & Push billing-service
         uses: docker/build-push-action@v5
         with:
           context: ./billing-service
           push: true
           tags: |
             arpitprajj/billing-service:latest
             arpitprajj/billing-service:${{ github.sha }}

       # ── 6. Build + Push: analytics-service ──
       - name: Build & Push analytics-service
         uses: docker/build-push-action@v5
         with:
           context: ./analytics-service
           push: true
           tags: |
             arpitprajj/analytics-service:latest
             arpitprajj/analytics-service:${{ github.sha }}

       # ── 7. Build + Push: api-gateway ──
       - name: Build & Push api-gateway
         uses: docker/build-push-action@v5
         with:
           context: ./api-gateway
           push: true
           tags: |
             arpitprajj/api-gateway:latest
             arpitprajj/api-gateway:${{ github.sha }}

       # ── 8. Deploy to Minikube ──
       - name: Deploy to Minikube
         run: |
           # Make sure minikube is running
           minikube status || minikube start

           # Apply all manifests
           kubectl apply -f k8s/

           # Force pods to pull new images (rollout restart)
           kubectl rollout restart deployment/patient-service
           kubectl rollout restart deployment/billing-service
           kubectl rollout restart deployment/analytics-service
           kubectl rollout restart deployment/api-gateway

           # Wait for rollouts
           kubectl rollout status deployment/patient-service --timeout=120s
           kubectl rollout status deployment/billing-service --timeout=120s
           kubectl rollout status deployment/analytics-service --timeout=120s
           kubectl rollout status deployment/api-gateway --timeout=120s

       # ── 9. Show running pods ──
       - name: Verify pods
         run: kubectl get pods
