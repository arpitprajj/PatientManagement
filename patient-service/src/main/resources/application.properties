server.port=4000
spring.datasource.url=jdbc:mysql://localhost:3306/patient_service
spring.datasource.username=root
spring.datasource.password=12345
#spring.datasource.url=jdbc:mysql://localhost:3307/patientdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
