apiVersion: apps/v1
kind: Deployment

metadata:
  name: auth-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      containers:
        - name: auth-service

          image: arpit420/auth-service:v1

          ports:
            - containerPort: 4005

          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://auth-mysql-service:3306/authdb

            - name: SPRING_DATASOURCE_USERNAME
              value: patientuser

            - name: SPRING_DATASOURCE_PASSWORD
              value: patientpass

            - name: JWT_SECRET
              value: wedfg6hyhy45dtguyhnx45dtbiuni78uyh45rdtfc

            